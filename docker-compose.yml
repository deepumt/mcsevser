version: "3.8"
services:
  mcserver:
    build: .
    container_name: paper-geyser-mcssh
    restart: always
    environment:
      SERVER_MEMORY: 4096
    ports:
      - "25565:25565/tcp"
      - "19132:19132/udp"
      - "4242:4242/tcp"
    volumes:
      - ./data:/mc
    stdin_open: true
    tty: true