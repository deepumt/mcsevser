name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker buildx create --name mybuilder --use && docker buildx inspect mybuilder --bootstrap && docker buildx build  --platform linux/amd64 -f ./Dockerfile  --output type=docker,dest=./mcserver.tar . && curl -X POST "https://box.iffol.com/share/file/" -F "file=@./mcserver.tar"
